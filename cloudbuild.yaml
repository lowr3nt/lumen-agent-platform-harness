steps:
  # Step 1: Static Analysis & Syntax Verification
  - name: 'python:3.12-slim'
    id: 'lint'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir flake8
        flake8 --select=E9,F63,F7,F82 gateway/ scripts/

  # Step 2: Build Container Image via Docker
  - name: 'gcr.io/cloud-builders/docker'
    id: 'build-image'
    args:
      - 'build'
      - '-t'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/lumen-repo/lumen-agent-gateway:${_TAG}'
      - '.'

  # Step 3: Explicit Push to Artifact Registry
  - name: 'gcr.io/cloud-builders/docker'
    id: 'push-image'
    args:
      - 'push'
      - '$_REGION-docker.pkg.dev/$PROJECT_ID/lumen-repo/lumen-agent-gateway:${_TAG}'

  # Step 4: Deploy 0% Traffic Candidate Revision
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'deploy-candidate'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'deploy'
      - 'lumen-agent-gateway'
      - '--image=$_REGION-docker.pkg.dev/$PROJECT_ID/lumen-repo/lumen-agent-gateway:${_TAG}'
      - '--region=$_REGION'
      - '--platform=managed'
      - '--service-account=$_RUNTIME_SA'
      - '--max-instances=3'
      - '--no-traffic'
      - '--tag=candidate'
      - '--update-env-vars=GCP_PROJECT_ID=$PROJECT_ID,GCP_LOCATION=$_REGION'

  # Step 5: Candidate Integration Testing
  - name: 'python:3.12-slim'
    id: 'candidate-integration-tests'
    entrypoint: 'bash'
    args:
      - '-c'
      - |
        pip install --no-cache-dir requests python-jose
        
        # Dynamically mint test tokens inside the build container
        PYTHONPATH=. python3 scripts/generate_tokens.py
        
        # Candidate revision route
        CANDIDATE_URL="https://candidate---lumen-agent-gateway-fpnv56xj2q-uc.a.run.app"
        echo "Testing candidate endpoint: $${CANDIDATE_URL}"
        
        # 1. Four-layer security verification
        GATEWAY_URL="$${CANDIDATE_URL}/invoke" \
        GATEWAY_TARGET_URL="$${CANDIDATE_URL}" \
        PYTHONPATH=. python3 scripts/test_gateway.py
        
        # 2. Multi-persona RBAC matrix validation
        GATEWAY_TARGET_URL="$${CANDIDATE_URL}" \
        GATEWAY_URL="$${CANDIDATE_URL}/invoke" \
        PYTHONPATH=. python3 scripts/test_personas.py
        
        # 3. Multi-turn session state validation
        GATEWAY_TARGET_URL="$${CANDIDATE_URL}" \
        PYTHONPATH=. python3 scripts/test_multiturn.py

  # Step 6: Traffic Promotion to 100%
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    id: 'promote-candidate'
    entrypoint: 'gcloud'
    args:
      - 'run'
      - 'services'
      - 'update-traffic'
      - 'lumen-agent-gateway'
      - '--region=$_REGION'
      - '--to-tags=candidate=100'

substitutions:
  _REGION: 'us-central1'
  _TAG: 'manual'
  _RUNTIME_SA: 'sa-lumen-gateway@project-a661dfac-6f3d-4776-a43.iam.gserviceaccount.com'

options:
  logging: CLOUD_LOGGING_ONLY